name: Daily crawl
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько страниц на магазин обработать"
        default: "600"
permissions:
  contents: write
concurrency: crawl
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка доступа к магазинам
        run: python cli.py probe
        continue-on-error: true
      - name: Сбор цен
        run: python cli.py daily --limit ${{ github.event.inputs.limit || '600' }}
      - name: Сохранить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/misses.json
          git diff --cached --quiet || (git commit -m "Обновление цен $(date -u +%F)" && git push)
